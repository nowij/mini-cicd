<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'빌드 #' + ${build.id} + ' - ' + ${project.name}">빌드 로그</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background-color: #1a1a2e; }
        #log-terminal {
            background: #0d1117;
            color: #c9d1d9;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            padding: 1rem 1.25rem;
            border-radius: 8px;
            min-height: 500px;
            max-height: 70vh;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .log-line { display: block; }
        .log-line:hover { background: rgba(255,255,255,.04); }
        .log-step    { color: #58a6ff; font-weight: bold; }
        .log-deploy  { color: #3fb950; }
        .log-warn    { color: #d29922; }
        .log-error   { color: #f85149; }
        .log-success { color: #3fb950; font-weight: bold; }
        .log-failed  { color: #f85149; font-weight: bold; }
        .status-badge-PENDING   { background:#6c757d; }
        .status-badge-BUILDING  { background:#0d6efd; animation:pulse 1.2s infinite; }
        .status-badge-DEPLOYING { background:#6f42c1; animation:pulse 1.2s infinite; }
        .status-badge-SUCCESS   { background:#198754; }
        .status-badge-FAILED    { background:#dc3545; }
        .status-badge-CANCELLED { background:#fd7e14; }
        .log-cancelled { color: #fd7e14; font-weight: bold; }
        @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.5} }
    </style>
</head>
<body>
<nav class="navbar navbar-dark px-4 py-2">
    <a class="navbar-brand fw-bold" href="/"><i class="bi bi-rocket-takeoff me-2"></i>CI/CD Dashboard</a>
</nav>

<div class="container py-4">
    <div class="d-flex align-items-center gap-2 mb-3 flex-wrap">
        <a th:href="@{/projects/{id}(id=${project.id})}" class="text-muted text-decoration-none">
            <i class="bi bi-chevron-left"></i>
        </a>
        <span th:text="${project.name}" class="fw-bold fs-5"></span>
        <span class="text-muted">/</span>
        <span class="text-muted">빌드 #<span th:text="${build.id}"></span></span>
        <span id="status-badge" class="badge rounded-pill ms-1"
              th:classappend="'status-badge-' + ${build.status}"
              th:text="${build.status}">상태</span>
        <div class="ms-auto d-flex gap-2 align-items-center">
            <span id="elapsed" class="text-muted small"></span>
            <button id="btn-cancel" class="btn btn-sm btn-danger" onclick="requestCancel()" style="display:none">
                <i class="bi bi-stop-fill me-1"></i>배포 중단
            </button>
            <button id="btn-scroll" class="btn btn-sm btn-outline-secondary" onclick="toggleAutoScroll()">
                <i class="bi bi-arrow-down-circle me-1"></i>자동 스크롤 ON
            </button>
        </div>
    </div>

    <div id="log-terminal"></div>

    <div class="mt-3 d-flex gap-2 flex-wrap" id="bottom-actions">
        <form th:action="@{/projects/{id}/deploy(id=${project.id})}" method="post"
              th:if="${build.status.name() == 'SUCCESS' or build.status.name() == 'FAILED' or build.status.name() == 'CANCELLED'}"
              id="redeploy-form" style="display:none">
            <button type="submit" class="btn btn-primary btn-sm"
                    onclick="return confirm('다시 배포하시겠습니까?')">
                <i class="bi bi-arrow-clockwise me-1"></i>재배포
            </button>
        </form>
        <a th:href="@{/projects/{id}(id=${project.id})}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-list-ul me-1"></i>빌드 목록
        </a>
    </div>
</div>

<script>
    const buildId = [[${build.id}]];
    const initialStatus = '[[${build.status}]]';
    const projectId = [[${project.id}]];

    const terminal      = document.getElementById('log-terminal');
    const statusBadge   = document.getElementById('status-badge');
    const elapsedEl     = document.getElementById('elapsed');
    const btnCancel     = document.getElementById('btn-cancel');
    const redeployForm  = document.getElementById('redeploy-form');

    let autoScroll = true;
    let startTime  = Date.now();
    let elapsedTimer = null;

    // ── 자동 스크롤 토글 ──────────────────────────────────
    function toggleAutoScroll() {
        autoScroll = !autoScroll;
        const btn = document.getElementById('btn-scroll');
        btn.innerHTML = autoScroll
            ? '<i class="bi bi-arrow-down-circle me-1"></i>자동 스크롤 ON'
            : '<i class="bi bi-pause-circle me-1"></i>자동 스크롤 OFF';
        btn.className = autoScroll ? 'btn btn-sm btn-outline-secondary' : 'btn btn-sm btn-secondary';
    }

    // ── 로그 라인 출력 ────────────────────────────────────
    function appendLine(text) {
        const span = document.createElement('span');
        span.className = 'log-line';
        if (text.startsWith('[STEP') || text.startsWith('===')) {
            span.classList.add('log-step');
        } else if (text.startsWith('[DEPLOY]')) {
            span.classList.add('log-deploy');
        } else if (text.startsWith('[WARN]')) {
            span.classList.add('log-warn');
        } else if (text.includes('BUILD CANCELLED')) {
            span.classList.add('log-cancelled');
        } else if (text.includes('BUILD FAILED') || text.startsWith('[ERROR]')) {
            span.classList.add('log-error');
        } else if (text.includes('BUILD SUCCESS')) {
            span.classList.add('log-success');
        }
        span.textContent = text;
        terminal.appendChild(span);
        if (autoScroll) terminal.scrollTop = terminal.scrollHeight;
    }

    // ── 상태 배지 + 하단 버튼 갱신 ────────────────────────
    function onBuildFinished(status) {
        statusBadge.textContent = status;
        statusBadge.className = 'badge rounded-pill ms-1 status-badge-' + status;
        btnCancel.style.display = 'none';
        if (['SUCCESS', 'FAILED', 'CANCELLED'].includes(status) && redeployForm) {
            redeployForm.style.display = 'inline-block';
        }
    }

    // ── 경과 시간 타이머 ──────────────────────────────────
    function startElapsedTimer() {
        elapsedTimer = setInterval(() => {
            elapsedEl.textContent = Math.floor((Date.now() - startTime) / 1000) + 's';
        }, 1000);
    }
    function stopElapsedTimer() {
        if (elapsedTimer) clearInterval(elapsedTimer);
    }

    // ── 배포 중단 요청 ────────────────────────────────────
    function requestCancel() {
        if (!confirm('정말 배포를 중단하시겠습니까?')) return;
        btnCancel.disabled = true;
        btnCancel.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>중단 중...';
        fetch('/builds/' + buildId + '/cancel', { method: 'POST' })
            .then(r => r.json())
            .then(() => appendLine('[INFO] 중단 요청을 전송했습니다.'))
            .catch(() => {
                btnCancel.disabled = false;
                btnCancel.innerHTML = '<i class="bi bi-stop-fill me-1"></i>배포 중단';
            });
    }

    // ── 진입 분기 ─────────────────────────────────────────
    const isRunning = ['PENDING', 'BUILDING', 'DEPLOYING'].includes(initialStatus);

    if (isRunning) {
        btnCancel.style.display = 'inline-block';
        startElapsedTimer();

        const evtSource = new EventSource('/builds/' + buildId + '/logs/stream');
        evtSource.addEventListener('log', e => appendLine(e.data));
        evtSource.addEventListener('done', () => {
            stopElapsedTimer();
            evtSource.close();
            fetch('/api/builds/' + buildId + '/logs')
                .then(r => r.json())
                .then(data => onBuildFinished(data.status));
        });
        evtSource.onerror = () => {
            stopElapsedTimer();
            evtSource.close();
            appendLine('[연결 종료]');
            btnCancel.style.display = 'none';
        };
    } else {
        // 이미 완료된 빌드
        fetch('/api/builds/' + buildId + '/logs')
            .then(r => r.json())
            .then(data => {
                data.lines.forEach(line => appendLine(line));
                onBuildFinished(data.status);
            });
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
