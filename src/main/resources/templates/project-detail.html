<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title th:text="${project.name} + ' - CI/CD'">프로젝트</title>
    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">
    <link href="/css/custom.css" rel="stylesheet">
    <style>
        .badge-SUCCESS   { background-color: #1cc88a; color: #fff; }
        .badge-FAILED    { background-color: #e74a3b; color: #fff; }
        .badge-BUILDING  { background-color: #4e73df; color: #fff; animation: badge-pulse 1.2s infinite; }
        .badge-DEPLOYING { background-color: #36b9cc; color: #fff; animation: badge-pulse 1.2s infinite; }
        .badge-PENDING   { background-color: #858796; color: #fff; }
        .badge-CANCELLED { background-color: #f6c23e; color: #fff; }
        @keyframes badge-pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
        .branch-item { cursor: pointer; padding: 8px 12px; border-radius: 6px; }
        .branch-item:hover { background: #f0f4ff; }
        .branch-item.selected { background: #e7f0ff; font-weight: 600; color: #4e73df; }
        .branch-list { max-height: 250px; overflow-y: auto; }
        .table td { vertical-align: middle; }
        .build-row:hover { background-color: #f8f9fc; cursor: pointer; }
    </style>
</head>
<body id="page-top">

<div id="wrapper">

    <!-- Sidebar -->
    <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">
        <a class="sidebar-brand d-flex align-items-center justify-content-center" href="/">
            <div class="sidebar-brand-icon">
                <i class="fas fa-rocket"></i>
            </div>
            <div class="sidebar-brand-text mx-3">CI/CD Pipeline</div>
        </a>
        <hr class="sidebar-divider my-0">
        <li class="nav-item active">
            <a class="nav-link" href="/">
                <i class="fas fa-fw fa-th-large"></i>
                <span>대시보드</span>
            </a>
        </li>
        <hr class="sidebar-divider">
        <div class="sidebar-heading">관리</div>
        <li class="nav-item">
            <a class="nav-link" href="/projects/new">
                <i class="fas fa-fw fa-plus-circle"></i>
                <span>새 프로젝트</span>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="/settings">
                <i class="fas fa-fw fa-sliders-h"></i>
                <span>시스템 설정</span>
            </a>
        </li>
        <hr class="sidebar-divider d-none d-md-block">
        <div class="text-center d-none d-md-inline">
            <button class="rounded-circle border-0" id="sidebarToggle"></button>
        </div>
    </ul>
    <!-- End of Sidebar -->

    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">

            <!-- Topbar -->
            <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
                <button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3">
                    <i class="fa fa-bars"></i>
                </button>
                <ol class="breadcrumb mb-0 bg-transparent">
                    <li class="breadcrumb-item">
                        <a href="/" class="text-primary">대시보드</a>
                    </li>
                    <li class="breadcrumb-item active" th:text="${project.name}"></li>
                </ol>
                <ul class="navbar-nav ml-auto mr-3">
                    <li class="nav-item my-auto">
                        <a href="/projects/new" class="btn btn-primary btn-sm">
                            <i class="fas fa-plus fa-sm mr-1"></i>새 프로젝트
                        </a>
                    </li>
                </ul>
            </nav>
            <!-- End of Topbar -->

            <!-- Page Content -->
            <div class="container-fluid">

                <!-- Flash messages -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
                    <i class="fas fa-check-circle mr-2"></i>
                    <span th:text="${successMessage}"></span>
                    <button type="button" class="close" data-dismiss="alert"><span>&times;</span></button>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
                    <i class="fas fa-exclamation-circle mr-2"></i>
                    <span th:text="${errorMessage}"></span>
                    <button type="button" class="close" data-dismiss="alert"><span>&times;</span></button>
                </div>
                <div th:if="${warnMessage}" class="alert alert-warning alert-dismissible fade show">
                    <i class="fas fa-exclamation-triangle mr-2"></i>
                    <span th:text="${warnMessage}"></span>
                    <button type="button" class="close" data-dismiss="alert"><span>&times;</span></button>
                </div>

                <!-- Page Heading -->
                <div class="d-sm-flex align-items-center justify-content-between mb-4 flex-wrap">
                    <div class="d-flex align-items-center mb-2 mb-sm-0">
                        <a href="/" class="btn btn-link p-0 mr-2 text-gray-400">
                            <i class="fas fa-chevron-left"></i>
                        </a>
                        <h1 class="h3 mb-0 text-gray-800 mr-2" th:text="${project.name}">프로젝트명</h1>
                        <span class="badge badge-info"
                              th:text="${project.projectType.displayName}"></span>
                    </div>
                    <div class="d-flex flex-wrap">
                        <button type="button"
                                class="btn btn-primary btn-sm mr-2 mb-1"
                                th:data-project-id="${project.id}"
                                th:data-project-name="${project.name}"
                                th:data-project-branch="${project.branch}"
                                onclick="openDeployModal(this.dataset.projectId, this.dataset.projectName, this.dataset.projectBranch)">
                            <i class="fas fa-play fa-sm mr-1"></i>배포 시작
                        </button>
                        <form th:if="${project.deployHost != null and project.stopCommand != null}"
                              th:action="@{/projects/{id}/stop(id=${project.id})}" method="post"
                              onsubmit="return confirm('실행 중인 앱을 종료하시겠습니까?')"
                              class="d-inline mr-2 mb-1">
                            <button type="submit" class="btn btn-warning btn-sm">
                                <i class="fas fa-stop fa-sm mr-1"></i>동작 중지
                            </button>
                        </form>
                        <a th:href="@{/projects/{id}/edit(id=${project.id})}"
                           class="btn btn-outline-secondary btn-sm mr-2 mb-1">
                            <i class="fas fa-cog fa-sm mr-1"></i>설정
                        </a>
                        <form th:action="@{/projects/{id}/delete(id=${project.id})}" method="post"
                              onsubmit="return confirm('프로젝트를 삭제하시겠습니까? 모든 빌드 기록도 삭제됩니다.')"
                              class="d-inline mb-1">
                            <button type="submit" class="btn btn-outline-danger btn-sm">
                                <i class="fas fa-trash fa-sm"></i>
                            </button>
                        </form>
                    </div>
                </div>

                <div class="row">
                    <!-- 프로젝트 정보 -->
                    <div class="col-lg-4 mb-4">
                        <div class="card shadow h-100">
                            <div class="card-header py-3">
                                <h6 class="m-0 font-weight-bold text-primary">
                                    <i class="fas fa-info-circle mr-2"></i>프로젝트 정보
                                </h6>
                            </div>
                            <div class="card-body">
                                <table class="table table-sm table-borderless mb-0 small">
                                    <tbody>
                                        <tr>
                                            <td class="text-gray-500 font-weight-bold" style="width:35%">저장소</td>
                                            <td class="text-truncate" style="max-width:0">
                                                <a th:href="${project.repoUrl}" target="_blank"
                                                   th:text="${project.repoUrl}"
                                                   class="text-truncate d-block"
                                                   style="max-width:160px"></a>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td class="text-gray-500 font-weight-bold">브랜치</td>
                                            <td>
                                                <span class="badge badge-light border">
                                                    <i class="fas fa-code-branch mr-1"></i>
                                                    <span th:text="${project.branch}"></span>
                                                </span>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td class="text-gray-500 font-weight-bold">타입</td>
                                            <td th:text="${project.projectType.displayName}"></td>
                                        </tr>
                                        <tr th:if="${project.deployHost != null}">
                                            <td class="text-gray-500 font-weight-bold">배포 서버</td>
                                            <td th:text="${project.deployHost + ':' + project.deployPort}"></td>
                                        </tr>
                                        <tr th:if="${project.deployHost != null}">
                                            <td class="text-gray-500 font-weight-bold">서버 OS</td>
                                            <td th:text="${project.deployOs}"></td>
                                        </tr>
                                        <tr>
                                            <td class="text-gray-500 font-weight-bold">생성일</td>
                                            <td th:text="${#temporals.format(project.createdAt, 'yyyy-MM-dd')}"></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- 빌드 히스토리 -->
                    <div class="col-lg-8 mb-4">
                        <div class="card shadow">
                            <div class="card-header py-3 d-flex align-items-center justify-content-between">
                                <h6 class="m-0 font-weight-bold text-primary">
                                    <i class="fas fa-history mr-2"></i>빌드 히스토리
                                </h6>
                                <span class="badge badge-light border small" th:unless="${#lists.isEmpty(builds)}"
                                      th:text="${#lists.size(builds)} + '건'"></span>
                            </div>
                            <div class="card-body p-0">
                                <!-- 빌드 없음 -->
                                <div th:if="${#lists.isEmpty(builds)}" class="text-center py-5">
                                    <i class="fas fa-clock fa-3x text-gray-300 mb-3"></i>
                                    <p class="text-gray-400 mb-0">빌드 기록이 없습니다.</p>
                                </div>

                                <!-- 빌드 테이블 -->
                                <div class="table-responsive" th:unless="${#lists.isEmpty(builds)}">
                                    <table class="table mb-0 small">
                                        <thead class="thead-light">
                                            <tr>
                                                <th class="border-0">#</th>
                                                <th class="border-0">상태</th>
                                                <th class="border-0">브랜치</th>
                                                <th class="border-0">시작</th>
                                                <th class="border-0">소요</th>
                                                <th class="border-0">로그</th>
                                                <th class="border-0"></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr class="build-row"
                                                th:each="build : ${builds}"
                                                th:onclick="|location.href='/builds/${build.id}/logs'|">
                                                <td class="text-muted font-weight-bold" th:text="${build.id}"></td>
                                                <td>
                                                    <span class="badge"
                                                          th:classappend="'badge-' + ${build.status}"
                                                          th:text="${build.status}"></span>
                                                </td>
                                                <td>
                                                    <span th:if="${build.branch != null}"
                                                          class="badge badge-light border">
                                                        <i class="fas fa-code-branch mr-1"></i>
                                                        <span th:text="${build.branch}"></span>
                                                    </span>
                                                    <span th:unless="${build.branch != null}" class="text-muted">-</span>
                                                </td>
                                                <td th:text="${#temporals.format(build.startedAt, 'MM/dd HH:mm:ss')}"></td>
                                                <td>
                                                    <span th:if="${build.finishedAt != null}"
                                                          th:text="${build.durationSeconds + 's'}"></span>
                                                    <span th:unless="${build.finishedAt != null}"
                                                          class="text-primary">진행 중...</span>
                                                </td>
                                                <td>
                                                    <a th:href="@{/builds/{id}/logs(id=${build.id})}"
                                                       class="btn btn-outline-secondary btn-sm"
                                                       onclick="event.stopPropagation()">
                                                        <i class="fas fa-terminal fa-sm"></i>
                                                    </a>
                                                </td>
                                                <td>
                                                    <form th:action="@{/projects/{id}/deploy(id=${project.id})}"
                                                          method="post"
                                                          onclick="event.stopPropagation()">
                                                        <input type="hidden" name="branch"
                                                               th:value="${build.branch != null ? build.branch : project.branch}">
                                                        <button type="submit"
                                                                class="btn btn-outline-primary btn-sm"
                                                                title="같은 브랜치로 재시도">
                                                            <i class="fas fa-redo fa-sm"></i>
                                                        </button>
                                                    </form>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
            <!-- End Page Content -->
        </div>

        <footer class="sticky-footer bg-white">
            <div class="container my-auto">
                <div class="copyright text-center my-auto">
                    <span>CI/CD Pipeline &copy; 2026</span>
                </div>
            </div>
        </footer>
    </div>
</div>

<a class="scroll-to-top rounded" href="#page-top"><i class="fas fa-angle-up"></i></a>

<!-- 배포 모달 -->
<div class="modal fade" id="deployModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title font-weight-bold">
                    <i class="fas fa-rocket text-primary mr-2"></i>배포 시작
                </h5>
                <button class="close" type="button" data-dismiss="modal"><span>&times;</span></button>
            </div>
            <div class="modal-body">
                <p class="small text-muted mb-1" id="modal-project-name"></p>
                <hr class="mt-2 mb-3">
                <p class="text-xs font-weight-bold text-uppercase text-gray-500 mb-2">배포할 브랜치 선택</p>

                <div id="branch-loading" class="text-center py-3">
                    <div class="spinner-border spinner-border-sm text-primary mr-2" role="status"></div>
                    <span class="text-muted small">브랜치 목록을 불러오는 중...</span>
                </div>

                <div id="branch-list-area" class="branch-list" style="display:none"></div>

                <div id="branch-manual-area" style="display:none">
                    <div class="alert alert-warning small py-2 mb-2">
                        <i class="fas fa-exclamation-triangle mr-1"></i>브랜치 목록을 불러오지 못했습니다. 직접 입력하세요.
                    </div>
                    <input type="text" id="branch-manual-input" class="form-control form-control-sm"
                           placeholder="브랜치 이름 입력 (예: main)">
                </div>
            </div>
            <div class="modal-footer">
                <span class="mr-auto small text-muted">
                    선택: <strong id="selected-branch-label" class="text-primary">-</strong>
                </span>
                <button type="button" class="btn btn-secondary btn-sm" data-dismiss="modal">취소</button>
                <button type="button" class="btn btn-primary btn-sm" onclick="submitDeploy()">
                    <i class="fas fa-play fa-sm mr-1"></i>배포 시작
                </button>
            </div>
        </div>
    </div>
</div>

<form id="deploy-form" method="post" style="display:none">
    <input type="hidden" name="branch" id="deploy-branch-input">
</form>

<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/vendor/jquery-easing/jquery.easing.min.js"></script>
<script src="/js/sb-admin-2.min.js"></script>
<script>
    let currentProjectId = null;
    let selectedBranch = null;

    function openDeployModal(projectId, projectName, defaultBranch) {
        currentProjectId = projectId;
        selectedBranch = defaultBranch;

        document.getElementById('modal-project-name').textContent = projectName;
        document.getElementById('selected-branch-label').textContent = defaultBranch;
        document.getElementById('branch-loading').style.display = 'block';
        document.getElementById('branch-list-area').style.display = 'none';
        document.getElementById('branch-manual-area').style.display = 'none';

        $('#deployModal').modal('show');

        fetch('/api/projects/' + projectId + '/branches')
            .then(r => { if (!r.ok) throw new Error(); return r.json(); })
            .then(branches => renderBranches(branches, defaultBranch))
            .catch(() => showManualInput(defaultBranch));
    }

    function renderBranches(branches, defaultBranch) {
        const area = document.getElementById('branch-list-area');
        area.innerHTML = '';
        branches.forEach(b => {
            const isDefault = b === defaultBranch;
            const div = document.createElement('div');
            div.className = 'branch-item d-flex align-items-center' + (isDefault ? ' selected' : '');
            div.dataset.branch = b;
            div.innerHTML = `<i class="fas fa-code-branch text-muted mr-2 fa-sm"></i><span>${escapeHtml(b)}</span>`
                + (isDefault ? '<span class="badge badge-primary ml-auto" style="font-size:.7rem">기본</span>' : '');
            div.onclick = () => selectBranch(b);
            area.appendChild(div);
        });
        document.getElementById('branch-loading').style.display = 'none';
        area.style.display = 'block';
        selectBranch(defaultBranch);
    }

    function selectBranch(branch) {
        selectedBranch = branch;
        document.getElementById('selected-branch-label').textContent = branch;
        document.querySelectorAll('.branch-item').forEach(el => {
            el.classList.toggle('selected', el.dataset.branch === branch);
        });
    }

    function showManualInput(defaultBranch) {
        document.getElementById('branch-loading').style.display = 'none';
        document.getElementById('branch-manual-area').style.display = 'block';
        const input = document.getElementById('branch-manual-input');
        input.value = defaultBranch;
        input.oninput = () => {
            selectedBranch = input.value;
            document.getElementById('selected-branch-label').textContent = input.value || '-';
        };
    }

    function submitDeploy() {
        const branch = selectedBranch || document.getElementById('branch-manual-input').value || 'main';
        document.getElementById('deploy-form').action = '/projects/' + currentProjectId + '/deploy';
        document.getElementById('deploy-branch-input').value = branch;
        $('#deployModal').modal('hide');
        document.getElementById('deploy-form').submit();
    }

    function escapeHtml(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
</script>
</body>
</html>
